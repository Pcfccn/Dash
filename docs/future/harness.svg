<text x="735" y="232" font-size="11" fill="#0f5f50" text-anchor="start" font-weight="bold">X5: 8 проводов</text>
<text x="735" y="247" font-size="11" fill="#0f5f50" text-anchor="start" font-weight="normal">X5.1 VCC … X5.8 LED</text>
<rect x="1010" y="330" width="290" height="110" rx="8" fill="#eef5fc" stroke="#1f6fd1" stroke-width="1.6"/>
<text x="1020" y="350" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Плата GPS ATGM336H</text>
<text x="1020" y="368" font-size="11" fill="#333" text-anchor="start" font-weight="normal">под лобовым стеклом, антенной вверх,</text>
<text x="1020" y="383" font-size="11" fill="#333" text-anchor="start" font-weight="normal">не под металлом и тонировкой с фольгой</text>
<text x="1020" y="398" font-size="11" fill="#333" text-anchor="start" font-weight="normal">VCC — только 3V3</text>
<text x="1020" y="413" font-size="11" fill="#333" text-anchor="start" font-weight="normal">до 1.5 м, подальше от силовых проводов</text>
<line x1="820" y1="395.2" x2="1010" y2="395.2" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="820" y1="398.4" x2="1010" y2="398.4" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="820" y1="401.6" x2="1010" y2="401.6" stroke="#1f6fd1" stroke-width="2.2" stroke-linecap="round"/>
<line x1="820" y1="404.8" x2="1010" y2="404.8" stroke="#6c757d" stroke-width="2.2" stroke-linecap="round"/>
<text x="840" y="428" font-size="11" fill="#1f6fd1" text-anchor="start" font-weight="bold">X3: 4 провода</text>
<text x="840" y="443" font-size="11" fill="#1f6fd1" text-anchor="start" font-weight="normal">1 3V3 · 2 GND · 3 TX · 4 RX</text>
<rect x="470" y="610" width="380" height="160" rx="8" fill="#f6f7f8" stroke="#6c757d" stroke-width="1.6"/>
<text x="480" y="630" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Заглушка LC100: 3 кнопки 8 мм (1NO)</text>
<text x="480" y="648" font-size="11" fill="#333" text-anchor="start" font-weight="normal">контакт 1 кнопок ▶ / ● / ◀ → X4.1 / X4.2 / X4.3</text>
<text x="480" y="663" font-size="11" fill="#333" text-anchor="start" font-weight="normal">контакт 2 всех трёх — вместе → X4.4 (GND)</text>
<text x="480" y="678" font-size="11" fill="#333" text-anchor="start" font-weight="normal">кольцо подсветки 12–24 В — НЕ через Dash:</text>
<text x="480" y="693" font-size="11" fill="#333" text-anchor="start" font-weight="normal">  «+» → ILL+, «−» → ILL− (гаснет реостатом)</text>
<text x="480" y="708" font-size="11" fill="#333" text-anchor="start" font-weight="normal">  или «−» на массу (всегда ярко)</text>
<text x="480" y="723" font-size="11" fill="#333" text-anchor="start" font-weight="normal">разъём 6.3 мм 8P у заглушки — по желанию</text>
<line x1="655.2" y1="490" x2="655.2" y2="610" stroke="#6c757d" stroke-width="2.2" stroke-linecap="round"/>
<line x1="658.4" y1="490" x2="658.4" y2="610" stroke="#6c757d" stroke-width="2.2" stroke-linecap="round"/>
<line x1="661.6" y1="490" x2="661.6" y2="610" stroke="#6c757d" stroke-width="2.2" stroke-linecap="round"/>
<line x1="664.8" y1="490" x2="664.8" y2="610" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="674.0" y="548" font-size="11" fill="#6c757d" text-anchor="start" font-weight="bold">X4.1–X4.4: 4 провода к кнопкам</text>
<rect x="960" y="620" width="340" height="120" rx="8" fill="#fff5f5" stroke="#d62828" stroke-width="1.6"/>
<text x="970" y="640" font-size="13" fill="#111" text-anchor="start" font-weight="bold">ILL+ (габариты)</text>
<text x="970" y="658" font-size="11" fill="#333" text-anchor="start" font-weight="normal">12 В при включённых габаритах, при любом</text>
<text x="970" y="673" font-size="11" fill="#333" text-anchor="start" font-weight="normal">положении реостата (плюс, не ILL−)</text>
<text x="970" y="688" font-size="11" fill="#333" text-anchor="start" font-weight="normal">удобно взять у разъёма соседней</text>
<text x="970" y="703" font-size="11" fill="#333" text-anchor="start" font-weight="normal">штатной кнопки с подсветкой</text>
<line x1="960" y1="680.0" x2="900" y2="680.0" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="900.0" y1="680" x2="900.0" y2="520" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="900" y1="520.0" x2="690.0" y2="520.0" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="690.0" y1="520" x2="690.0" y2="490" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<text x="910" y="506" font-size="11" fill="#d62828" text-anchor="start" font-weight="bold">X4.5 красный — ILL+</text>
<text x="644.0" y="514" font-size="10" fill="#888" text-anchor="end" font-weight="normal">X4.6 — запас</text>
</svg>