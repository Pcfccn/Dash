<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="30" font-size="20" fill="#111" text-anchor="start" font-weight="bold">Жгут Dash: пять веток от коробки</text>
<text x="20" y="52" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Длины мерить по месту по будущей трассе (шнурком), + 15 см запаса. Исключение — экран: шлейф X5 не длиннее 15–20 см.</text>
<rect x="520" y="300" width="280" height="170" rx="12" fill="#fbfbf3" stroke="#8a8a5a" stroke-width="2.5"/>
<text x="660.0" y="360" font-size="16" fill="#6a6a3a" text-anchor="middle" font-weight="bold">Коробка Dash</text>
<text x="660.0" y="382" font-size="12" fill="#6a6a3a" text-anchor="middle" font-weight="normal">140 × 82 × 38</text>
<text x="660.0" y="400" font-size="11" fill="#6a6a3a" text-anchor="middle" font-weight="normal">провода — через отверстия</text>
<text x="660.0" y="414" font-size="11" fill="#6a6a3a" text-anchor="middle" font-weight="normal">в стенке, высоко (25–30 мм от дна)</text>
<rect x="500.0" y="327.0" width="40" height="26" rx="4" fill="#e3f1e3" stroke="#1d5a1d" stroke-width="1.5"/>
<text x="520" y="344" font-size="11" fill="#1d5a1d" text-anchor="middle" font-weight="bold">X1</text>
<rect x="500.0" y="417.0" width="40" height="26" rx="4" fill="#e3f1e3" stroke="#1d5a1d" stroke-width="1.5"/>
<text x="520" y="434" font-size="11" fill="#1d5a1d" text-anchor="middle" font-weight="bold">X2</text>
<rect x="780.0" y="327.0" width="40" height="26" rx="4" fill="#e3f1e3" stroke="#1d5a1d" stroke-width="1.5"/>
<text x="800" y="344" font-size="11" fill="#1d5a1d" text-anchor="middle" font-weight="bold">X5</text>
<rect x="780.0" y="387.0" width="40" height="26" rx="4" fill="#e3f1e3" stroke="#1d5a1d" stroke-width="1.5"/>
<text x="800" y="404" font-size="11" fill="#1d5a1d" text-anchor="middle" font-weight="bold">X3</text>
<rect x="647.0" y="450.0" width="26" height="40" rx="4" fill="#e3f1e3" stroke="#1d5a1d" stroke-width="1.5"/>
<text x="660.0" y="474" font-size="11" fill="#1d5a1d" text-anchor="middle" font-weight="bold">X4</text>
<rect x="30" y="90" width="250" height="92" rx="8" fill="#fff5f5" stroke="#d62828" stroke-width="1.6"/>
<text x="40" y="110" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Провод ACC</text>
<text x="40" y="128" font-size="11" fill="#333" text-anchor="start" font-weight="normal">найти мультиметром:</text>
<text x="40" y="143" font-size="11" fill="#333" text-anchor="start" font-weight="normal">12 В в ACC и ON, 0 В без ключа</text>
<text x="40" y="158" font-size="11" fill="#333" text-anchor="start" font-weight="normal">врезка: пайка, без разреза провода</text>
<rect x="30" y="230" width="250" height="60" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
<text x="40" y="250" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Масса кузова</text>
<text x="40" y="268" font-size="11" fill="#333" text-anchor="start" font-weight="normal">болт на металле, краску зачистить</text>
<rect x="300" y="142" width="74" height="26" rx="4" fill="#fff" stroke="#d62828" stroke-width="2"/>
<text x="337" y="160" font-size="12" fill="#d62828" text-anchor="middle" font-weight="bold">2 А</text>
<text x="337" y="186" font-size="10" fill="#d62828" text-anchor="middle" font-weight="normal">держатель</text>
<text x="337" y="198" font-size="10" fill="#d62828" text-anchor="middle" font-weight="normal">у врезки</text>
<line x1="280" y1="155.0" x2="300" y2="155.0" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="374" y1="155.0" x2="440" y2="155.0" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="440.0" y1="155" x2="440.0" y2="334" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<line x1="440" y1="334.0" x2="500" y2="334.0" stroke="#d62828" stroke-width="2.2" stroke-linecap="round"/>
<text x="452" y="196" font-size="11" fill="#d62828" text-anchor="start" font-weight="bold">X1.1 красный</text>
<text x="452" y="211" font-size="11" fill="#d62828" text-anchor="start" font-weight="normal">+12 В ACC</text>
<line x1="280" y1="262.0" x2="420" y2="262.0" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="420.0" y1="262" x2="420.0" y2="346" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="420" y1="346.0" x2="500" y2="346.0" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="300" y="252" font-size="11" fill="#222" text-anchor="start" font-weight="bold">X1.2 чёрный — масса</text>
<rect x="30" y="420" width="270" height="132" rx="8" fill="#f7f2fc" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="40" y="440" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Разветвитель OBD2 (Y)</text>
<text x="40" y="458" font-size="11" fill="#333" text-anchor="start" font-weight="normal">штекер — в разъём OBD машины</text>
<text x="40" y="473" font-size="11" fill="#333" text-anchor="start" font-weight="normal">гнездо 1 — свободно для сканера</text>
<text x="40" y="488" font-size="11" fill="#333" text-anchor="start" font-weight="normal">гнездо 2 — Dash: штекер OBD2 «папа»</text>
<text x="40" y="503" font-size="11" fill="#333" text-anchor="start" font-weight="normal">или хвост разветвителя:</text>
<text x="40" y="518" font-size="11" fill="#333" text-anchor="start" font-weight="normal">пины 6, 14, 5</text>
<line x1="300" y1="482.8" x2="450" y2="482.8" stroke="#d9a400" stroke-width="2.2" stroke-linecap="round"/>
<line x1="300" y1="486.0" x2="450" y2="486.0" stroke="#2a9d3a" stroke-width="2.2" stroke-linecap="round"/>
<line x1="300" y1="489.2" x2="450" y2="489.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="446.8" y1="486" x2="446.8" y2="430" stroke="#d9a400" stroke-width="2.2" stroke-linecap="round"/>
<line x1="450.0" y1="486" x2="450.0" y2="430" stroke="#2a9d3a" stroke-width="2.2" stroke-linecap="round"/>
<line x1="453.2" y1="486" x2="453.2" y2="430" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="450" y1="426.8" x2="500" y2="426.8" stroke="#d9a400" stroke-width="2.2" stroke-linecap="round"/>
<line x1="450" y1="430.0" x2="500" y2="430.0" stroke="#2a9d3a" stroke-width="2.2" stroke-linecap="round"/>
<line x1="450" y1="433.2" x2="500" y2="433.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="30" y="576" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="bold">X2: 3 провода</text>
<text x="30" y="591" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="normal">X2.1 жёлтый — пин 6 CAN-H</text>
<text x="30" y="606" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="normal">X2.2 зелёный — пин 14 CAN-L</text>
<text x="30" y="621" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="normal">X2.3 чёрный — пин 5 земля</text>
<text x="30" y="636" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="normal">жёлтый и зелёный — витая пара,</text>
<text x="30" y="651" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="normal">3–4 витка на 10 см</text>
<rect x="1010" y="90" width="290" height="110" rx="8" fill="#eefaf6" stroke="#16a085" stroke-width="1.6"/>
<text x="1020" y="110" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Экран 4" ILI9488</text>
<text x="1020" y="128" font-size="11" fill="#333" text-anchor="start" font-weight="normal">8 проводов, ≤ 15–20 см (SPI 18.75 МГц)</text>
<text x="1020" y="143" font-size="11" fill="#333" text-anchor="start" font-weight="normal">коробка — прямо за экраном</text>
<text x="1020" y="158" font-size="11" fill="#333" text-anchor="start" font-weight="normal">к выводам экрана — пайкой</text>
<text x="1020" y="173" font-size="11" fill="#333" text-anchor="start" font-weight="normal">+ термоусадка, без разъёма</text>
