<text x="32" y="490" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">До шага 4: ток в вывод LED при 3.3 В и при 5 В. Единицы мА — LED только вход управления: записать (build-hardware.md §3).</text>
