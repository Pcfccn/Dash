<text x="830" y="296" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">CAN-H и CAN-L скрутить; от разветвителя до X2 ≤ 30 см</text>
<rect x="20" y="320" width="1060" height="56" rx="6" fill="#f1faf2" stroke="#2a9d3a" stroke-width="1.5"/>
<text x="32" y="338" font-size="12" fill="#1d6a2a" text-anchor="start" font-weight="bold">Проверка</text>
<text x="32" y="356" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">Ключ выключен: между пинами 6 и 14 разветвителя ~60 Ом (две штатные оконечные). Если ~40 Ом — 120 Ом на модуле не снят.</text>
<text x="32" y="373" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">Модуль: 3V3 ↔ GND не звонятся; CTX звонится с PD1, CRX — с PD0.</text>
