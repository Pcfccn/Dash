<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="30" font-size="18" fill="#111" text-anchor="start" font-weight="bold">Шаг 5. CAN: модуль SN65HVD230 → X2 → разветвитель OBD2</text>
<text x="20" y="52" font-size="12" fill="#555" text-anchor="start" font-weight="normal">На модуле снять резистор 120 Ом (маркировка 121, у выводов CANH/CANL): в машине шина уже согласована.</text>
