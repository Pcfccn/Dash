<text x="30" y="250" font-size="11" fill="#7a3a00" text-anchor="start" font-weight="normal">экран при «100 %».</text>
<rect x="20" y="560" width="1060" height="56" rx="6" fill="#f1faf2" stroke="#2a9d3a" stroke-width="1.5"/>
<text x="32" y="578" font-size="12" fill="#1d6a2a" text-anchor="start" font-weight="bold">Проверка</text>
<text x="32" y="596" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">До прошивки: PA8 не звонится с затвором Si4599 напрямую — только через R2 1 к на G 2N7000.</text>
<text x="32" y="613" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">После прошивки ROAD INV: в режиме яркости 10 / 50 / 100 % подсветка меняется в ту же сторону, 2N7000 и Si4599 не греются.</text>
