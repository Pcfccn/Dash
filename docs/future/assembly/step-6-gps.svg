<text x="640" y="256" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">в жгуте: TX — белый, RX — синий</text>
<rect x="20" y="320" width="1060" height="56" rx="6" fill="#f1faf2" stroke="#2a9d3a" stroke-width="1.5"/>
<text x="32" y="338" font-size="12" fill="#1d6a2a" text-anchor="start" font-weight="bold">Проверка</text>
<text x="32" y="356" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">Прозвонка: X3.3 ↔ PA3 и X3.4 ↔ PA2 — по ~100 Ом. VCC платы GPS звонится с шиной 3V3, а не с 5 В.</text>
<text x="32" y="373" font-size="12" fill="#1d4d26" text-anchor="start" font-weight="normal">После прошивки: на DIAG «GPS ?» → «V…» → «спутники/скорость». «GPS -» — скорее всего, перепутаны TX и RX.</text>
