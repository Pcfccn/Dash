<text x="20" y="30" font-size="18" fill="#111" text-anchor="start" font-weight="bold">Шаг 6. GPS: X3 (4 конт.) → плата ATGM336H</text>
<text x="20" y="52" font-size="12" fill="#555" text-anchor="start" font-weight="normal">TX и RX перекрещиваются: передатчик модуля → вход МК (PA3), выход МК (PA2) → приёмник модуля. В каждой линии — 100 Ом у X3.</text>
